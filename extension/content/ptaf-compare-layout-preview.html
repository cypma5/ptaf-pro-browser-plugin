<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="http://127.0.0.1:8765/content.css">
<style>
  body { margin: 24px; background: #12141a; }
  .frame { width: 720px; }
</style>
</head>
<body>
<div class="ptaf-theme frame" data-theme="dark">
  <article class="ptaf-compare-param">
    <h3>check_vars.WEBSOCKET_UPSTREAM</h3>
    <div class="ptaf-compare-board">
      <div class="ptaf-compare-param-side is-target">
        <p class="ptaf-compare-caption">Шаблон</p>
        <div class="ptaf-compare-flags">
          <span class="ptaf-compare-flag">values</span>
          <span class="ptaf-compare-flag">xml</span>
          <span class="ptaf-compare-flag">json</span>
          <span class="ptaf-compare-flag" data-extra="true">html_entities</span>
        </div>
        <button type="button" class="ptaf-compare-arrow">В политику →</button>
      </div>
      <div class="ptaf-compare-param-side">
        <p class="ptaf-compare-caption">Политика</p>
        <div class="ptaf-compare-flags">
          <span class="ptaf-compare-flag">values</span>
          <span class="ptaf-compare-flag">xml</span>
          <span class="ptaf-compare-flag">json</span>
          <span class="ptaf-compare-flag">html_entities</span>
        </div>
        <button type="button" class="ptaf-compare-arrow">← В шаблон</button>
      </div>
    </div>
    <div class="ptaf-compare-param-pending">
      <p class="ptaf-compare-target-note">После «Записать» в шаблоне «Test user template» значение станет таким. Остальное не изменится.</p>
      <div class="ptaf-compare-param-pending-actions">
        <button type="button" class="ptaf-compare-remove">Убрать</button>
        <button type="button" class="ptaf-compare-write">Записать</button>
      </div>
    </div>
  </article>
</div>
</body>
</html>
